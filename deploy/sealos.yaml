apiVersion: app.sealos.io/v1
kind: Template
metadata:
  name: gerous-game
spec:
  title: '仇恨体系'
  url: 'https://github.com/zhaomeiniu5658/gerous-game'
  gitRepo: 'https://github.com/zhaomeiniu5658/gerous-game'
  author: 'zhaomeiniu5658'
  description: '手机小游戏主界面预览'
  readme: ''
  icon: ''
  templateType: inline
  locale: zh
  categories: []
  defaults:
    app_name:
      type: string
      value: gerous-game-${{ random(8) }}
    app_host:
      type: string
      value: gerous-game-${{ random(8) }}
  inputs: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ defaults.app_name }}
  annotations:
    originImageName: ccr.ccs.tencentyun.com/tenvoice/gerous-game:v0.5.2-20261014
    deploy.cloud.sealos.io/minReplicas: '1'
    deploy.cloud.sealos.io/maxReplicas: '1'
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: ${{ defaults.app_name }}
  template:
    metadata:
      labels:
        app: ${{ defaults.app_name }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: gerous-game-tcr
      containers:
        - name: ${{ defaults.app_name }}
          image: ccr.ccs.tencentyun.com/tenvoice/gerous-game:v0.5.2-20261014
          imagePullPolicy: IfNotPresent
          env:
            - {name: PGHOST, value: gerous-users-db-20261014-pg-postgresql}
            - {name: PGPORT, value: '5432'}
            - {name: PGDATABASE, value: postgres}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: gerous-users-db-20261014-pg-conn-credential, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: gerous-users-db-20261014-pg-conn-credential, key: password}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 20m, memory: 25Mi}
            limits: {cpu: 200m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: ${{ defaults.app_name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${{ defaults.app_name }}
  labels:
    app: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager: ${{ defaults.app_name }}
    cloud.sealos.io/app-deploy-manager-domain: ${{ defaults.app_host }}
    cloud.sealos.io/deploy-on-sealos: ${{ defaults.app_name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  rules:
    - host: ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: ${{ defaults.app_name }}
                port:
                  number: 8080
  tls:
    - hosts:
        - ${{ defaults.app_host }}.${{ SEALOS_CLOUD_DOMAIN }}
      secretName: ${{ SEALOS_CERT_SECRET_NAME }}
